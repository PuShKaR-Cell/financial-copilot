services:
  searxng:
    image: searxng/searxng:latest
    container_name: mobile-assistant-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - BASE_URL=http://localhost:8888/
      - INSTANCE_NAME=mobile-assistant
    restart: unless-stopped
