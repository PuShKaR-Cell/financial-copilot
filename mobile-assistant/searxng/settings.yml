use_default_settings: true

general:
  instance_name: "mobile-assistant"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "change-me-to-a-long-random-string"
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0"
  port: 8080

ui:
  static_use_hash: true

engines:
  - name: wikipedia
    disabled: false
  - name: duckduckgo
    disabled: false
